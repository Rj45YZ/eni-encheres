<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - ENI-Enchères</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}"
          href="../static/css/style.css">
</head>

<body>

    <!-- Header avec uniquement Accueil -->
    <div th:replace="~{fragments/header-simple :: header}"></div>

    <main class="inscription">

        <h1>Nouveau profil</h1>

        <form id="form-inscription"
              class="form-inscription"
              action="/inscription"
              method="post">

            <label for="pseudo">Pseudo *</label>
            <input
                type="text"
                id="pseudo"
                name="pseudo"
                required
            >

            <label for="nom">Nom *</label>
            <input
                type="text"
                id="nom"
                name="nom"
                required
            >

            <label for="prenom">Prénom *</label>
            <input
                type="text"
                id="prenom"
                name="prenom"
                required
            >

            <label for="email">Email *</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="telephone">Téléphone</label>
            <input
                type="tel"
                id="telephone"
                name="telephone"
            >

            <fieldset>
                <legend>Adresse *</legend>

                <label for="rue">Rue</label>
                <input
                    type="text"
                    id="rue"
                    name="rue"
                    required
                >

                <label for="codePostal">Code postal</label>
                <input
                    type="text"
                    id="codePostal"
                    name="codePostal"
                    required
                >

                <label for="ville">Ville</label>
                <input
                    type="text"
                    id="ville"
                    name="ville"
                    required
                >
            </fieldset>

            <label for="motDePasse">Mot de passe *</label>
            <input
                type="password"
                id="motDePasse"
                name="motDePasse"
                required
            >

            <label for="confirmation">Confirmation *</label>
            <input
                type="password"
                id="confirmation"
                required
            >

            <p id="message-erreur" class="erreur"></p>

            <div class="boutons-inscription">
                <button type="submit">Créer</button>

                <a href="/">Annuler</a>
            </div>

        </form>

    </main>

    <script
        th:src="@{/js/inscription.js}"
        src="../static/js/inscription.js">
    </script>
    <script th:src="@{/js/script.js}" src="../static/js/script.js"></script>
</body>

</html>
