<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - ENI-Enchères</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}"
          href="../static/css/style.css">
</head>

<body>

    <main class="inscription">

        <h1>Nouveau Profil</h1>

        <form id="form-inscription"
              class="form-inscription"
              th:action="@{/inscription}"
              action="#"
              method="post">

            <div class="champ-inscription">
                <label for="pseudo">Pseudo (*) :</label>
                <input type="text" id="pseudo" name="pseudo" pattern="[A-Za-z0-9_]+" required autocomplete="username">
            </div>

            <div class="champ-inscription">
                <label for="nom">Nom (*) :</label>
                <input type="text" id="nom" name="nom" required autocomplete="family-name">
            </div>

            <div class="champ-inscription">
                <label for="prenom">Prénom (*) :</label>
                <input type="text" id="prenom" name="prenom" required autocomplete="given-name">
            </div>

            <div class="champ-inscription">
                <label for="email">Email (*) :</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="champ-inscription">
                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="telephone" autocomplete="tel">
            </div>

            <div class="adresse-inscription">
                <label class="adresse-label" for="rue">Adresse (*) :</label>
                <input type="text" id="rue" name="rue" placeholder="Rue" required autocomplete="street-address">

                <label class="sr-only" for="codePostal">Code postal</label>
                <input type="text" id="codePostal" name="codePostal" placeholder="Code postal" required autocomplete="postal-code">

                <label class="sr-only" for="ville">Ville</label>
                <input type="text" id="ville" name="ville" placeholder="Ville" required autocomplete="address-level2">
            </div>

            <div class="champ-inscription">
                <label for="motDePasse">Mot de passe (*) :</label>
                <input type="password" id="motDePasse" name="motDePasse" required autocomplete="new-password">
            </div>

            <div class="champ-inscription">
                <label for="confirmation">Confirmation (*) :</label>
                <input type="password" id="confirmation" required autocomplete="new-password">
            </div>

            <p id="message-erreur" class="inscription-message" role="status" aria-live="polite" hidden></p>

            <div class="boutons-inscription">
                <button type="submit">Créer</button>
                <a th:href="@{/}" href="accueil.html">Annuler</a>
            </div>

        </form>

    </main>

    <script th:src="@{/js/script.js}" src="../static/js/script.js"></script>
</body>

</html>
